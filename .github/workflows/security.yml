name: Security Scan (SAST)
on: [push, pull_request]

jobs:
    bandit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: set up Python
              uses: actions-setup-python@v4
              with:
                python-version: '3.12'
            - name: Install Bandit
              run: pip  install bandit
            - name: Run Bandit Scan
              run: Bandit -r . -f txt